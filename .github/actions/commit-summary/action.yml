name: Commit summary
description: Summarises a GameTracking commit with Claude Code and posts it as a commit comment. Reads the API key from the ANTHROPIC_API_KEY environment variable.

inputs:
    sha:
        description: 'Commit to summarise'
        required: true
    model:
        description: 'Claude model'
        required: false
        default: 'claude-sonnet-5-5'

runs:
    using: composite
    steps:
        - name: Prepare prompt
          id: prepare
          shell: bash
          working-directory: tracked_game
          run: |
            # Older builds are needed for revert checks and "is this new" lookups
            git fetch --quiet --deepen=30 origin

            {
              echo 'prompt<<EOF_PROMPT'
              cat "$GITHUB_ACTION_PATH/prompt.md"
              echo
              echo '## This run'
              echo '- The game repository is checked out at `tracked_game/`; run git as `git -C tracked_game …`.'
              echo '- The commit to summarise is `<sha>` = `${{ inputs.sha }}`.'
              echo '- Write the comment body (or `NO_COMMENT`) to `commit_summary.md` in the current directory. That is the only file you may write.'
              echo 'EOF_PROMPT'
            } >> "$GITHUB_OUTPUT"

        - name: Run Claude Code
          uses: anthropics/claude-code-action@v1
          with:
            anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
            github_token: ${{ github.token }}
            prompt: ${{ steps.prepare.outputs.prompt }}
            claude_args: >-
              --model ${{ inputs.model }}
              --allowedTools "Bash,Read,Grep,Glob,Agent,Write(commit_summary.md)"

        - name: Post comment
          shell: bash
          run: |
            if [[ ! -s commit_summary.md ]] || [[ "$(tr -d '[:space:]`' < commit_summary.md)" == "NO_COMMENT" ]]; then
              echo "Nothing worth commenting"
              exit 0
            fi

            printf '\n\n---\n<sub>This summary was generated by AI and may contain mistakes.</sub>\n' >> commit_summary.md

            gh api "repos/$GITHUB_REPOSITORY/commits/${{ inputs.sha }}/comments" \
              -F body=@commit_summary.md
          env:
            GH_TOKEN: ${{ github.token }}
