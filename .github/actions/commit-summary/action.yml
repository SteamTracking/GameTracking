name: Commit summary
description: Summarises a GameTracking commit with Claude Code and posts it as a commit comment. Reads the API key from the ANTHROPIC_API_KEY environment variable.

inputs:
    sha:
        description: 'Commit to summarise'
        required: true
    model:
        description: 'Claude model'
        required: false
        default: 'claude-sonnet-5-5'

runs:
    using: composite
    steps:
        - name: Prepare prompt
          shell: bash
          working-directory: tracked_game
          run: |
            # Older builds are needed for revert checks and "is this new" lookups
            git fetch --quiet --deepen=30 origin

            # Latest state of the other Source 2 games, to spot shared engine changes
            for repo in GameTracking-CS2 GameTracking-Dota2 GameTracking-Deadlock; do
              if [[ "$GITHUB_REPOSITORY" != "SteamTracking/$repo" ]]; then
                git clone --quiet --depth=1 "https://github.com/SteamTracking/$repo.git" "$GITHUB_WORKSPACE/siblings/$repo" &
              fi
            done
            wait

            {
              cat "$GITHUB_ACTION_PATH/prompt.md"
              echo
              echo '## This run'
              echo '- The game repository is checked out at `tracked_game/`; run git as `git -C tracked_game …`.'
              echo '- The commit to summarise is `<sha>` = `${{ inputs.sha }}`.'
              echo '- Repos of the other games are checked out at their latest commit under `siblings/`.'
              echo '- Write the comment body (or `NO_COMMENT`) to `commit_summary.md` in the current directory. Apart from temporary files, that is the only file you may write.'
            } > "$RUNNER_TEMP/commit_summary_prompt.md"

        # The installers are per platform, both install to ~/.local/bin. Retried as downloads can be rate limited.
        - name: Install Claude Code (Windows)
          if: runner.os == 'Windows'
          shell: pwsh
          run: |
            for ($attempt = 1; $true; $attempt++) {
              try {
                & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1)))
                if (Test-Path "$env:USERPROFILE\.local\bin\claude.exe") { break }
                throw "claude.exe was not installed"
              } catch {
                if ($attempt -ge 3) { throw }
                Write-Host "Install attempt $attempt failed: $_"
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        - name: Install Claude Code (Linux)
          if: runner.os != 'Windows'
          shell: bash
          run: |
            set -o pipefail
            for attempt in 1 2 3; do
              if curl -fsSL https://claude.ai/install.sh | bash; then
                break
              fi
              if [[ $attempt == 3 ]]; then
                exit 1
              fi
              echo "Install attempt $attempt failed"
              sleep $((10 * attempt))
            done
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        - name: Run Claude Code
          shell: bash
          run: |
            claude -p "$(cat "$RUNNER_TEMP/commit_summary_prompt.md")" \
              --model "${{ inputs.model }}" \
              --allowedTools "Bash,Read,Grep,Glob,Agent,Write(commit_summary.md)"

        - name: Post comment
          shell: bash
          run: |
            if [[ ! -s commit_summary.md ]] || [[ "$(tr -d '[:space:]`' < commit_summary.md)" == "NO_COMMENT" ]]; then
              echo "Nothing worth commenting"
              exit 0
            fi

            printf '\n\n---\n<sub>This summary was generated by AI and may contain mistakes.</sub>\n' >> commit_summary.md

            gh api "repos/$GITHUB_REPOSITORY/commits/${{ inputs.sha }}/comments" \
              -F body=@commit_summary.md
          env:
            GH_TOKEN: ${{ github.token }}
