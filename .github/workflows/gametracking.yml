name: GameTracking

on:
    workflow_call:
        inputs:
            appid:
                required: true
                type: string
            branch:
                required: false
                type: string
                default: 'public'
            run-on-windows:
                required: false
                type: boolean
                default: false
            save-manifest:
                required: false
                type: boolean
                default: true
            reset-gametracking:
                required: false
                type: boolean
                default: false
            dumpsource2-schema-json:
                required: false
                type: string
                default: ''
            dispatch-source2wiki:
                required: false
                type: boolean
                default: false
        secrets:
            STEAM_USERNAME:
                required: true
            STEAM_PASSWORD:
                required: true
jobs:
    gametracking-setup:
        runs-on: ${{ inputs.run-on-windows && 'windows-latest' || 'ubuntu-latest' }}
        # Permissions come from the calling job: contents and statuses write, plus id-token write for commit summaries with Workload Identity Federation.
        # Requesting id-token here would fail the whole run for callers that do not grant it.
        steps:

        # Checkout and download tools

        - name: Checkout shared GameTracking
          uses: actions/checkout@v7
          with:
            fetch-depth: 1
            repository: 'SteamTracking/GameTracking'

        - name: Download pre-built tools
          shell: bash
          run: |
            if [[ "$(uname -s)" == MINGW* ]] || [[ "$(uname -s)" == MSYS* ]]; then
              ARCHIVE="tools-win-x64.tar.gz"
            else
              ARCHIVE="tools-linux-x64.tar.gz"
            fi

            gh release download tools \
              --repo SteamTracking/GameTracking \
              --pattern "$ARCHIVE" \
              --dir .

            tar xzf "$ARCHIVE" -C tools/
            rm "$ARCHIVE"
          env:
            GH_TOKEN: ${{ github.token }}

        - name: Checkout game repository (${{ github.repository }})
          uses: actions/checkout@v7
          with:
            fetch-depth: 1
            path: tracked_game

        # Optional Node.js setup

        - name: Check for package-lock.json
          id: package-lock-json-exists
          shell: bash
          run: echo "exists=$(test -f ${{ github.workspace }}/tracked_game/package-lock.json && echo true || echo false)" >> $GITHUB_OUTPUT

        - name: Setup Node.js
          if: steps.package-lock-json-exists.outputs.exists == 'true'
          uses: actions/setup-node@v7
          with:
            node-version: '24'
            cache: 'npm'
            cache-dependency-path: ${{ github.workspace }}/tracked_game/package-lock.json

        - name: Install Node.js dependencies
          if: steps.package-lock-json-exists.outputs.exists == 'true'
          working-directory: ${{ github.workspace }}/tracked_game
          run: npm ci

        # Download and process

        - name: Configure git user
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global core.safecrlf false

        - name: Get current commit SHA
          id: before
          working-directory: ${{ github.workspace }}/tracked_game
          shell: bash
          run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

        - name: Delete all folders for cleanup
          if: ${{ inputs.reset-gametracking }}
          working-directory: ${{ github.workspace }}/tracked_game
          shell: bash
          run: |
            find . -mindepth 1 -maxdepth 1 -type d \
            ! -name 'node_modules' \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} \;

        - name: Download app ${{ inputs.appid }}
          working-directory: ${{ github.workspace }}/tracked_game
          shell: bash
          run: |
            . ../common.sh
            $STEAM_FILE_DOWNLOADER_PATH track --username "${{ secrets.STEAM_USERNAME }}" --password "${{ secrets.STEAM_PASSWORD }}" --appid "${{ inputs.appid }}" --output . --branch "${{ inputs.branch }}" ${{ inputs.save-manifest && '--save-all-manifests' || '' }}

        - name: Run update script
          id: update
          continue-on-error: true
          working-directory: ${{ github.workspace }}/tracked_game
          shell: bash
          run: ./update.sh

        # Post-processing

        - name: Set commit status
          if: always() && steps.before.outputs.sha
          id: set-status
          working-directory: ${{ github.workspace }}/tracked_game
          shell: bash
          run: |
            NEW_SHA=$(git rev-parse HEAD)
            echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT

            if [[ "$NEW_SHA" == "${{ steps.before.outputs.sha }}" ]]; then
              echo "No new commit was pushed, skipping status"
              exit 0
            fi

            if [[ "${{ job.status }}" == "success" && "${{ steps.update.outcome }}" == "success" ]]; then
              STATE="success"
            else
              STATE="failure"
            fi

            gh api "repos/${{ github.repository }}/statuses/$NEW_SHA" \
              -f state="$STATE" \
              -f target_url="$GITHUB_SERVER_URL/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f description="GameTracking" \
              -f context="GameTracking"
          env:
            GH_TOKEN: ${{ github.token }}

        - name: Create SchemaExplorer token
          id: schemaexplorer-token
          if: ${{ inputs.dumpsource2-schema-json != '' && github.repository_owner == 'SteamTracking' && github.ref_name == github.event.repository.default_branch && steps.before.outputs.sha != steps.set-status.outputs.sha }}
          uses: actions/create-github-app-token@v3
          with:
            client-id: ${{ secrets.STEAMTRACKING_APP_CLIENT_ID }}
            private-key: ${{ secrets.STEAMTRACKING_APP_PRIVATE_KEY }}
            owner: ValveResourceFormat
            repositories: SchemaExplorer
            permission-contents: write

        - name: Checkout DumpSource2 JSON Repo
          if: ${{ inputs.dumpsource2-schema-json != '' && github.repository_owner == 'SteamTracking' && github.ref_name == github.event.repository.default_branch && steps.before.outputs.sha != steps.set-status.outputs.sha }}
          uses: actions/checkout@v7
          with:
            fetch-depth: 1
            path: dumps2_json
            repository: 'ValveResourceFormat/SchemaExplorer'
            token: ${{ steps.schemaexplorer-token.outputs.token }}

        - name: Push DumpSource2 JSON
          if: ${{ inputs.dumpsource2-schema-json != '' && github.repository_owner == 'SteamTracking' && github.ref_name == github.event.repository.default_branch && steps.before.outputs.sha != steps.set-status.outputs.sha }}
          working-directory: ${{ github.workspace }}/dumps2_json/schemas
          shell: bash
          run: |
            "${{ github.workspace }}/tools/push_schema_json.sh" \
              "${{ inputs.dumpsource2-schema-json }}" \
              "${{ github.workspace }}/tracked_game" \
              "https://github.com/${{ github.repository }}/commit/${{ steps.set-status.outputs.sha }}"

        - name: Create Protobufs token
          id: protobufs-token
          if: ${{ github.repository_owner == 'SteamTracking' && github.ref_name == github.event.repository.default_branch }}
          uses: actions/create-github-app-token@v3
          with:
            client-id: ${{ secrets.STEAMTRACKING_APP_CLIENT_ID }}
            private-key: ${{ secrets.STEAMTRACKING_APP_PRIVATE_KEY }}
            owner: SteamTracking
            repositories: Protobufs
            permission-contents: write

        - name: Dispatch sync to ValveProtobufs
          if: ${{ github.repository_owner == 'SteamTracking' && github.ref_name == github.event.repository.default_branch }}
          run: gh api repos/SteamTracking/Protobufs/dispatches -f event_type=sync
          env:
                GH_TOKEN: ${{ steps.protobufs-token.outputs.token }}

        - name: Dispatch app-update to Source2Wiki
          if: ${{ inputs.dispatch-source2wiki && env.GH_TOKEN != '' && github.ref_name == github.event.repository.default_branch && steps.before.outputs.sha != steps.set-status.outputs.sha }}
          run: gh api repos/Source2Wiki/Source2Wiki/dispatches -f event_type=app-update -F "client_payload[owner]={owner}" -F "client_payload[repo]={repo}"
          env:
                GH_TOKEN: ${{ secrets.DISPATCH_TOKEN_SOURCE2WIKI }}

        - name: Summarize commit
          id: summary
          if: ${{ (env.ANTHROPIC_FEDERATION_RULE_ID != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '') && steps.set-status.outputs.sha && steps.before.outputs.sha != steps.set-status.outputs.sha }}
          continue-on-error: true
          timeout-minutes: 120
          uses: ./.github/actions/commit-summary
          with:
            sha: ${{ steps.set-status.outputs.sha }}
          env:
            ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
            ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
            ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

        - name: Fail if update script or commit summary failed
          if: ${{ steps.update.outcome == 'failure' || steps.summary.outcome == 'failure' }}
          run: exit 1

